name: mihrab
description: "A new Flutter project."
publish_to: 'none'

version: 2.0.1+33


environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  quran: ^1.3.1
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.1.0
  image_picker: ^1.0.4
  url_launcher: ^6.2.5
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  firebase_messaging: ^15.1.6
  google_sign_in: ^7.2.0

  adhan: ^2.0.0
  geolocator: ^10.1.0
  intl: ^0.20.2

  just_audio: ^0.9.36
  audio_session: ^0.1.18
  rxdart: ^0.27.7
  # Updated audio_service and just_audio_background to stable, compatible versions
  audio_service: ^0.18.9
  just_audio_background: ^0.0.1-beta.9

  shared_preferences: ^2.2.2
  provider: ^6.1.1
  cached_network_image: ^3.3.1

  flutter_downloader: ^1.11.1
  path_provider: ^2.1.1
  path_provider_linux: ^2.2.1
  path_provider_windows: ^2.3.0

  font_awesome_flutter: ^10.7.0
  glassmorphism: ^3.0.0
  showcaseview: ^3.0.0
  awesome_notifications: ^0.10.0

  scrollable_positioned_list: ^0.3.8
  flutter_compass: ^0.8.0
  flutter_native_splash: ^2.4.0
  hijri: ^3.0.0


  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  quran_library: ^1.3.2

  flutter_foreground_task: ^9.1.0
  flutter_local_notifications: ^19.5.0
  permission_handler: ^12.0.1
  geocoding: ^4.0.0
  
  # Security packages
  flutter_dotenv: ^6.0.0
  crypto: ^3.0.7
  flutter_secure_storage: 8.1.0
  google_fonts: ^6.3.2
  get: ^4.7.3
  percent_indicator: ^4.2.5
  connectivity_plus: ^6.0.3
  qcf_quran: ^0.0.4
  package_info_plus: ^8.0.0
  google_mobile_ads: ^5.3.0
  just_audio_windows: ^0.2.2
  sqlite3: ^2.9.4
  desktop_webview_auth: ^0.0.16
  water_drop_nav_bar: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  flutter_launcher_icons: "^0.13.1"

# Added dependency override to resolve version conflicts
dependency_overrides:
  audio_service_platform_interface: ^0.1.0
  path_provider_linux: ^2.2.1
  path_provider_windows: ^2.3.0
  sqlite3: ^2.9.4
  drift: ^2.10.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/background.png
    - assets/logo.png
    - assets/quran3d.jpg
    - assets/MohamedHonsy.jpg
    - assets/default_shaykh.png
    - assets/data/adhkar.json
    - assets/json/
    - assets/sounds/
    - assets/images/mushaf/
    - assets/dbs/
    - assets/welcome/



  fonts:
    - family: UthmanTN
      fonts:
        - asset: assets/fonts/UthmanTN/UthmanTN-Regular.ttf
        - asset: assets/fonts/UthmanTN/UthmanTN-Bold.ttf
          weight: 700
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/UthmanicHafs1Ver18.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Bold.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo_padded.png" # مسار صورتك
  min_sdk_android: 21
  # لون الخلفية للأيقونات الحديثة (عشان مايكونش وراها أبيض)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo_padded.png"

# ✅ 2. إعدادات شاشة البداية (Splash)
flutter_native_splash:
  color: "#FFFFFF" # لون الخلفية
  image: "assets/logo_padded.png" # اللوجو في النص

  android_12:
    image: "assets/logo_padded.png"
    icon_background_color: "#FFFFFF"

  android: true
  ios: false
  fullscreen: true # لإخفاء شريط الحالة (الساعة والبطارية) أثناء الفتح
